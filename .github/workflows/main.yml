name: VD Monitor

on:
  schedule:
    - cron: '*/30 * * * *'  # Runs every 30 minutes
  workflow_dispatch:        # Allows manual trigger

# One run at a time: overlapping runs would ping the same products twice
concurrency:
  group: vd-monitor
  cancel-in-progress: false

jobs:
  run-monitor:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: pip install beautifulsoup4 curl-cffi

      # -u: unbuffered, so log lines are timestamped as they happen
      - name: Run Monitor
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python -u monitor.py

      # Runs even when the monitor step fails, so products that were already
      # pinged get saved and are not pinged again next run
      - name: Commit and Push changes
        if: ${{ !cancelled() }}
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git add seen_products.json site_status.json
          git commit -m "Update seen products" || exit 0
          git pull --rebase
          git push
